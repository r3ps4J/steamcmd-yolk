---
name: Release
on:
  release:
    types: [published]

jobs:
  # Builds the Dockerfile and pushes it to GHCR
  release:
    name: Release - Docker image (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: debian
            latest: true
          - tag: proton
            latest: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Docker - GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Docker - Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=semver,pattern=${{ matrix.tag }}-v{{version}}
            type=semver,pattern=${{ matrix.tag }}-v{{major}}.{{minor}}
            type=semver,pattern=${{ matrix.tag }}-v{{major}}
          flavor: latest=${{ matrix.latest }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./${{ matrix.tag }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_VERSION_TAG=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
