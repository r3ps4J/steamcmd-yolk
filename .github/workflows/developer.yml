---
name: Developer image
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # Builds the Dockerfile and pushes it to GHCR
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: debian
          - tag: proton
    name: Release - Docker image (${{ matrix.tag }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Docker - GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create image tag suffix
        id: suffix
        run: echo "suffix=${{ github.event_name == 'push' && 'dev' || github.sha }}" >> $GITHUB_OUTPUT

      - name: Docker - Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=${{ matrix.tag }}-${{ steps.suffix.outputs.suffix }}
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./${{ matrix.tag }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_VERSION_TAG=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
